<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrossel de Mídias</title>

<style>
    body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .carousel {
        width: 80%;
        max-width: 900px;
        overflow: hidden;
        position: relative;
    }

    .track {
        display: flex;
        transition: transform 0.5s ease;
    }

    .item {
        min-width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
    }

    img, video {
        max-width: 100%;
        max-height: 80vh;
    }

    .nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 30px;
        color: #fff;
        background: rgba(0,0,0,0.5);
        border: none;
        cursor: pointer;
        padding: 10px;
    }

    .prev { left: 10px; }
    .next { right: 10px; }
</style>
</head>
<body>

<div class="carousel">
    <div class="track" id="track">

        <!-- IMAGENS -->
        <div class="item">
            <img src="./antes_e_depois.jpg" alt="">
        </div>

        <div class="item">
            <img src="./Imagem do WhatsApp de 2025-09-17 à(s) 10.02.59_4be735b1.png" alt="">
        </div>

        <div class="item">
            <img src="./noticia_fluxo_3.jpg" alt="">
        </div>

        <div class="item">
            <img src="./Sorriso-Branco-Amarelo-fix.png" alt="">
        </div>

        <div class="item">
            <img src="./Sorriso-Branco-Amarelo.png" alt="">
        </div>

        <!-- VÍDEOS -->
        <div class="item">
            <video src="./campanha_followup_implantes.mp4" controls></video>
        </div>

        <div class="item">
            <video src="./plantao_implante_primare.mp4" controls></video>
        </div>

        <div class="item">
            <video src="./plantao_implante_primare_um.mp4" controls></video>
        </div>

    </div>

    <button class="nav prev" onclick="prev()">❮</button>
    <button class="nav next" onclick="next()">❯</button>
</div>

<script>
    const track = document.getElementById('track');
    const total = document.querySelectorAll('.item').length;
    let index = 0;

    function update() {
        track.style.transform = `translateX(-${index * 100}%)`;
    }

    function next() {
        index = (index + 1) % total;
        update();
    }

    function prev() {
        index = (index - 1 + total) % total;
        update();
    }
</script>

</body>
</html>
